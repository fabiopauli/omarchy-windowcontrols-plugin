name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes jq shellcheck
      - name: Validate JSON
        run: python -m json.tool manifest.json >/dev/null
      - name: Check shell scripts
        run: shellcheck install.sh bin/*
      - name: Test repository contract and commands
        run: python -m unittest discover -s tests -v
